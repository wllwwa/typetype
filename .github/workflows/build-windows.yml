name: 打包 - Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 - Windows
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.9.26'

      - name: 准备构建目录
        run: |
          New-Item -ItemType Directory -Force -Path build-src | Out-Null
          Copy-Item -Recurse -Force main.py,pyproject.toml,uv.lock,src,resources,RinUI -Destination build-src

      - name: 安装依赖
        run: uv sync --frozen
        working-directory: build-src

      - name: 安装打包依赖
        run: uv run python -m ensurepip --upgrade
        working-directory: build-src

      - name: 升级 Nuitka
        run: uv pip install --upgrade nuitka --index-url https://pypi.org/simple
        working-directory: build-src

      - name: 运行打包
        run: |
          uv run python -m nuitka main.py `
            --follow-imports `
            --enable-plugin=pyside6 `
            --include-qt-plugins=qml `
            --include-package=RinUI `
            --include-data-dir=RinUI=RinUI `
            --output-dir=deployment `
            --quiet `
            --noinclude-qt-translations `
            --standalone `
            --noinclude-dlls=Qt6WebEngine* `
            --windows-console-mode=disable `
            --include-windows-runtime-dlls=yes `
            --assume-yes-for-downloads `
            --include-data-dir=src/qml=src/qml `
            --include-data-dir=resources/texts=resources/texts `
            --include-data-files=resources/images/TypeTypeLogo.png=resources/images/TypeTypeLogo.png `
            --include-data-files=resources/fonts/HarmonyOS_Sans_SC_Regular.ttf=resources/fonts/HarmonyOS_Sans_SC_Regular.ttf `
            --include-data-files=resources/fonts/LXGWWenKai-Regular.ttf=resources/fonts/LXGWWenKai-Regular.ttf `
            --include-data-dir=resources/trainer=resources/trainer `
            --include-data-dir=resources/ziti=resources/ziti
        working-directory: build-src

      - name: 创建压缩包
        run: |
          $distDir = "build-src\deployment\main.dist"
          if (Test-Path $distDir) {
            # 列出文件用于调试
            Get-ChildItem $distDir -Recurse -Filter "*WebEngine*" | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            Compress-Archive -Path "$distDir\*" -DestinationPath typetype-windows-amd64.zip
          }
          else {
            Write-Error "未找到打包输出目录 $distDir"
            exit 1
          }

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: typetype-windows-amd64
          path: typetype-windows-amd64.zip
